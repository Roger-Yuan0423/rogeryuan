<style>
:root{--bg:#f4f7ff;--panel:#fff;--ink:#1f2937;--muted:#6b7280;--blue:#1a56db;--green:#15803d;--red:#dc2626;--orange:#ea580c;--purple:#7c3aed;--line:#dbe4ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111c34;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;flex-wrap:wrap}
header .logo{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1a56db,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900}
header h1{font-size:18px;margin:0}
header p{margin:2px 0 0;font-size:12px;opacity:.7}
header .spacer{flex:1}
main{max-width:920px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 12px rgba(26,86,219,.08);margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px}
.panel p.desc{font-size:13px;color:#555;line-height:1.7;margin:6px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:2px solid var(--line);background:#f8faff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
select{padding:9px 10px;border-radius:10px;border:2px solid var(--line);font-size:14px;font-weight:700;font-family:inherit;background:#fff}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;font-size:14px;font-family:inherit}
.btn-blue{background:var(--blue);color:#fff}.btn-green{background:var(--green);color:#fff}.btn-gray{background:#eee;color:#333}.btn-big{font-size:16px;padding:14px 20px;width:100%}
.statbar{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.stat{flex:1;min-width:110px;background:#f8faff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat small{font-size:12px;color:var(--muted);display:block}.stat b{font-size:22px}
.badge{font-size:12px;font-weight:900;border-radius:999px;padding:4px 10px;color:#fff}
.badge.cat{background:var(--purple)}.badge.num{background:#111}
#qtext{font-size:18px;font-weight:800;line-height:1.7;margin:8px 0 12px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#f8faff;border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;font-weight:700;cursor:pointer;line-height:1.6;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--blue);background:#fff}
.opt:disabled{cursor:default}
.opt.correct{background:#e8f5e9;border-color:var(--green)}
.opt.wrong{background:#ffebee;border-color:var(--red)}
.opt .letter{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#111;color:#fff;align-items:center;justify-content:center;font-size:13px;margin-right:8px}
.opt.correct .letter{background:var(--green)}.opt.wrong .letter{background:var(--red)}
#explain{display:none;background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:12px;font-size:14px;line-height:1.7;margin-top:10px}
#explain.show{display:block}#explain b{color:#bf360c}
.progress{height:8px;background:#e5e9f5;border-radius:999px;overflow:hidden;margin:6px 0}
#progBar{height:100%;width:0;background:var(--blue);transition:width .3s}
#timerWrap{height:10px;background:#e5e9f5;border-radius:999px;overflow:hidden;margin:8px 0 12px}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#f2a900,#dc2626);transition:width .2s linear}
.review-item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:14px;line-height:1.7}
.review-item.ok{border-left:6px solid var(--green)}.review-item.ng{border-left:6px solid var(--red)}
.hidden{display:none!important}
#bigEmoji{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.3);font-size:100px;z-index:9999;pointer-events:none;opacity:0}
#bigEmoji.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}55%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-90%) scale(1.1)}}
body.shake main{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,3px)}50%{transform:translate(7px,-5px)}75%{transform:translate(-4px,2px)}}
</style>
</head>

</div>
</main>

<script>
/* 題庫格式：{c:分類, q:題目, o:[4選項], a:正解index(0-3), e:解析} */
const QUESTIONS = [
/*B1運動科學*/
{c:"運動科學",q:"肌肉收縮時，下列哪個帶區長度不變？",o:["I-band","H-zone","A-band","Z線間距"],a:2,e:"肌凝蛋白長度不變，A-band不變；H-zone與I-band變短。"},
{c:"運動科學",q:"能產生最大張力的肌肉動作型態是？",o:["向心收縮","等長收縮","離心收縮","等速收縮"],a:2,e:"離心約為向心的1.2–1.5倍，其次等長，最小是向心。"},
{c:"運動科學",q:"阻力訓練初期（2–8週）力量進步主因是？",o:["肌纖維增粗","神經適應","骨密度增加","粒線體增生"],a:1,e:"初期為徵召↑、發放頻率↑、拮抗共縮↓；肥大是之後的事。"},
{c:"運動科學",q:"運動單位徵召依循什麼原則？",o:["隨機原則","大小原則（慢縮→快縮）","反向原則（快縮先）","全有全無同時徵召"],a:1,e:"低強度先徵召慢縮單位，高強度才徵到快縮單位。（出處：第1章1-11）"},
{c:"運動科學",q:"感受肌肉「被拉長速度」並引發牽張反射的是？",o:["高爾基腱器","肌梭","巴齊尼氏小體","關節受器"],a:1,e:"肌梭管長度變化；GTO管張力過大時抑制出力。"},
{c:"運動科學",q:"下列哪種纖維最抗疲勞、有氧能力最高？",o:["IIb型（Type IIx）","IIa型","I型（慢縮）","三者相同"],a:2,e:"書1-10：I型＝慢縮肌纖維（slow-twitch），有效率、抗疲勞；快縮產生力量快、放鬆也快、抽動時間短。（出處：1-10）"},
{c:"運動科學",q:"短跑、舉重選手通常哪型纖維比例較高？",o:["I型（慢縮）","IIa／IIb型（快縮）","平滑肌","心肌"],a:1,e:"爆發項目快縮纖維多；馬拉松則I型多。注意書中IIb型即Type IIx。（出處：1-10）"},
{c:"運動科學",q:"書中「肌肉全有或全無原則」指的是？",o:["運動神經元受刺激只讓其支配的肌纖維收縮，動作電位再強也不會更強","肌肉一半收縮一半放鬆","只有早上會收縮","重量越重收縮越小"],a:0,e:"書1-10：全有或全無原則（all-or-none principle），抽動（twitch）由鈣離子釋放引發。（出處：1-10）"},
{c:"運動科學",q:"書圖1.8中d所代表的是？",o:["單一抽動","兩個抽動加成","未融合性強直收縮","融合性強直收縮（tetanus）"],a:3,e:"a=抽動，b=兩個抽動加成（summation），c=未融合性，d=融合性強直收縮＝運動單位最大力量。（出處：圖1.8，1-10）"},
{c:"運動科學",q:"書中提到人體骨骼約有多少塊？",o:["106塊","206塊","306塊","406塊"],a:1,e:"書第1章：人體約為206個骨骼，骨骼漸進承受負荷才會變強。（出處：第1章）"},
{c:"運動科學",q:"肱二頭彎舉屬於第幾級槓桿？",o:["第1級","第2級","第3級","第4級"],a:2,e:"人體多為第3級，費力但速度快；踮腳尖為第2級最省力。"},
{c:"運動科學",q:"力量-速度曲線的關係是？",o:["速度越快力量越大","速度越快力量越小","兩者無關","速度固定力量才變"],a:1,e:"向心收縮速度↑、能產生的力↓；功率在中段最大。"},
{c:"運動科學",q:"增強式訓練利用的核心機制是？",o:["高爾基腱器抑制","牽張縮短循環SSC","交互抑制","倒U理論"],a:1,e:"離心預伸→過渡期越短越好→向心爆發，加上彈性位能。"},
{c:"運動科學",q:"ATP-PC系統的主要供能時間約為？",o:["0–10秒","30秒–2分鐘","2–10分鐘","超過30分鐘"],a:0,e:"書3-13：短高強度活動（高強度阻力訓練、衝刺）主要仰賴磷化物與快速醣解系統；磷化物測驗需3–5分鐘完全恢復（12-10）。（出處：第3章3-13）"},
{c:"運動科學",q:"400公尺跑、Wingate測驗主要依賴哪個系統？",o:["ATP-PC","快醣解系統","有氧氧化","三者均等"],a:1,e:"30秒–2分鐘高強度屬醣解，會產乳酸與H+。"},
{c:"運動科學",q:"1.5英哩（2.4公里）跑、12分鐘跑主要測什麼能力？",o:["最大肌力","無氧功率","有氧耐力","敏捷"],a:2,e:"第七項有氧能力測驗；超過2–3分鐘以氧化（有氧）系統為主。（出處：12-10、第3章）"},
{c:"運動科學",q:"下列哪組賀爾蒙屬於合成性（促進肌肉生長）？",o:["皮質醇、腎上腺素","睪固酮、GH、IGF-1","甲狀腺素、升糖素","胰高血糖素、皮質醇"],a:1,e:"合成促長，皮質醇為分解；大肌群多關節高強度刺激最大。"},
{c:"運動科學",q:"長期熱量不足＋過量有氧，最可能出現？",o:["睪固酮↑皮質醇↓","睪固酮↓皮質醇↑","GH歸零","胰島素暴增"],a:1,e:"能量虧損＋壓力大，分解高於合成，表現掉、易病。"},
{c:"運動科學",q:"有氧耐力訓練最明顯的中央適應是？",o:["肌纖維變粗","每跳輸出量SV↑、VO2max↑、安靜心率↓","骨密度暴增","無氧酵素暴增"],a:1,e:"心臟幫浦變強；無氧訓練對VO2max影響小。"},
{c:"運動科學",q:"骨骼對阻力訓練的適應可用何定律解釋？",o:["Wolff定律（受力塑形）","牛頓第三定律","倒U定律","能量守恆"],a:0,e:"縱向壓力＋肌肉拉力促進骨生成，需漸進負荷。"},
{c:"運動科學",q:"青少年肌力訓練最優先的目標是？",o:["測1RM拚最大重量","動作學習與多樣化","只練單關節","每天力竭"],a:1,e:"骨骺板未閉合前不測1RM，避免過早專項化與高壓。"},
{c:"運動科學",q:"女運動員三合症／RED-S不包含下列何者？",o:["低能量可利用性","月經失調","骨密度下降","血壓飆高"],a:3,e:"吃不夠＋訓練量大→賀爾蒙亂＋骨質差，耐力女選手高風險。"},
{c:"運動科學",q:"功率的定義是？",o:["力×速度","力÷時間","質量×身高","心率×血壓"],a:0,e:"爆發力＝又重又快，力量與速度都很重要。"},
{c:"運動科學",q:"書17-17指出用多RM預測1RM，何時較準確？",o:["用20RM預測","負荷越重（≤10RM）越準；目標反覆6次就測6RM","用猜的","重量越輕越準"],a:1,e:"目標反覆次數（goal repetitions）：課表做六次臥推就測6RM；實施測驗數月前都用輕多RM者，預估也較準(8)。（出處：17-17）"},
{c:"課表設計",q:"書17-19指出輔助動作的多RM測驗重量應？",o:["1RM天天測","等於或高於8RM，減輕關節結締組織壓力","越重越好","不用測"],a:1,e:"高反覆試舉疲勞降正確性；例：核心2RM但輔助最重只設8RM。訓練負荷以實測或估計1RM百分比計，或多RM決定（圖17.2）。（出處：17-19）"},
{c:"課表設計",q:"書表17.3中，垂直跳的相關訓練動作不包含？",o:["抓舉、爆發上搏","後蹲舉、前蹲舉","站立比目魚肌抬高（腳跟）","仰臥起坐"],a:3,e:"表17-3（17-7）：垂直跳→抓舉/爆發上搏/瞬發推舉/前後蹲舉/比目魚肌抬高；跑步衝刺→抓舉/爆發上搏/前蹲/弓步/登階/腿伸直/腿捲屈/腳趾抬高。（出處：表17.3）"},
{c:"運動科學",q:"肌腱與韌帶的訓練特性是？",o:["血流豐富適應超快","血流少、適應比肌肉慢，加量太快易肌腱病","完全不會適應","只靠拉筋變強"],a:1,e:"勁度↑有助爆發，但課表加量要漸進。"},
{c:"運動科學",q:"同時練大量長跑＋最大肌力，最可能發生？",o:["干擾效應，爆發進步打折","兩者都加倍進步","完全沒影響","只影響柔軟度"],a:0,e:"建議分開時段或用週期分開強調重點。"},
/*B2心理營養測驗*/
{c:"心理",q:"對長期維持訓練最有利的動機是？",o:["獎金","名次","內在動機（樂趣、成長）","怕被罵"],a:2,e:"內在比外在持久，外在獎勵拿掉行為易消失。"},
{c:"心理",q:"喚醒與表現最常考的理論是？",o:["倒U型（適中最好）","越高越好","越低越好","與表現無關"],a:0,e:"太緊張或太鬆都差；IZOF則說每人最佳區不同。"},
{c:"心理",q:"最能由選手自己控制的目標類型是？",o:["結果目標（奪冠）","裁判給分","過程目標（動作、呼吸）","對手失誤"],a:2,e:"過程目標最可控，配SMARTS設定最有效。"},
{c:"心理",q:"比賽前在腦中預演動作屬於哪種技巧？",o:["意象imagery","體重控制","按摩","冰敷"],a:0,e:"搭配自我對話、呼吸放鬆、注意力控制使用。"},
{c:"心理",q:"選手出現憂鬱、飲食失調徵兆，CSCS應？",o:["自行診斷開藥","辨識＋轉介專業，不做治療","叫他硬撐","退隊處分"],a:1,e:"超出執業範圍就轉介心理／醫療專業。"},
{c:"營養",q:"三大營養素每克熱量正確的是？",o:["醣4、蛋白4、脂肪9、酒精7","醣9、蛋白4、脂肪4","醣4、蛋白9、脂肪4","三者都是4"],a:0,e:"脂肪最高，酒精7，常考計算題。"},
{c:"營養",q:"一般肌力訓練者每日醣類建議約？",o:["1–2g/kg","5–7g/kg","15g/kg","不用吃醣"],a:1,e:"耐力選手7–10g/kg；吃不夠先掉表現。"},

<script>
(function(){
const $=id=>document.getElementById(id);
const CATS=["全部","運動科學","心理","營養","測驗評估","動作技術","課表設計","週期化","復健","設施管理"];
let curCat="全部",list=[],idx=0,score=0,right=0,wrong=0,streak=0,bestStreak=0,timer=null,timeLeft=0,answers=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function best(){try{return localStorage.getItem("cscs_best")||"--";}catch(e){return "--";}}
function setBest(v){try{if(best()==="--"||v>+best())localStorage.setItem("cscs_best",v);}catch(e){}}
$("best").textContent="🏆 最佳："+best();
$("totalQ").textContent=QUESTIONS.length;
const cc=$("catChips");cc.innerHTML="";
CATS.forEach(c=>{const n=c==="全部"?QUESTIONS.length:QUESTIONS.filter(q=>q.c===c).length;if(c!=="全部"&&n===0)return;
const b=document.createElement("button");b.className="chip"+(c===curCat?" active":"");b.textContent=c+" ("+n+")";
b.onclick=()=>{curCat=c;cc.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");};cc.appendChild(b);});
function pop(e){const el=$("bigEmoji");el.textContent=e;el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");}
$("startBtn").onclick=()=>{
let pool=curCat==="全部"?QUESTIONS.slice():QUESTIONS.filter(q=>q.c===curCat);
if(!pool.length){alert("此分類尚無題目");return;}
pool=shuffle(pool);
let n=parseInt($("qCount").value,10)||20;list=pool.slice(0,Math.min(n,pool.length));
if($("shuffleOpt").checked)list=list.map(q=>{const ord=shuffle([0,1,2,3]);return{c:q.c,q:q.q,o:ord.map(i=>q.o[i]),a:ord.indexOf(q.a),e:q.e};});
idx=0;score=0;right=0;wrong=0;streak=0;bestStreak=0;answers=[];
$("setupPanel").classList.add("hidden");$("resultPanel").classList.add("hidden");$("quizPanel").classList.remove("hidden");
renderQ();};
function stopTimer(){if(timer){clearInterval(timer);timer=null;}$("timerBar").style.width="100%";}
function renderQ(){
stopTimer();const q=list[idx];
$("qNum").textContent="Q"+(idx+1)+"/"+list.length;$("qCat").textContent=q.c+"｜"+curCat;
$("qtext").textContent=q.q;
$("progBar").style.width=(idx/list.length*100)+"%";
const box=$("opts");box.innerHTML="";const ex=$("explain");ex.className="";ex.innerHTML="";$("nextBtn").classList.add("hidden");
const letters=["A","B","C","D"];
q.o.forEach((t,i)=>{const btn=document.createElement("button");btn.className="opt";
btn.innerHTML='<span class="letter">'+letters[i]+'</span>'+t;
btn.onclick=()=>answer(i,btn);box.appendChild(btn);});
const secs=parseInt($("qTime").value,10)||0;
if(secs>0){timeLeft=secs;$("timerWrap").style.display="block";$("timerBar").style.width="100%";
timer=setInterval(()=>{timeLeft-=0.2;$("timerBar").style.width=Math.max(0,timeLeft/secs*100)+"%";
if(timeLeft<=0){stopTimer();answer(-1,null);}},200);
}else{$("timerWrap").style.display="none";}
}
function answer(pick,btn){
stopTimer();const q=list[idx];const ok=pick===q.a;
const btns=$("opts").querySelectorAll(".opt");
btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("correct");});
if(ok){right++;streak++;bestStreak=Math.max(bestStreak,streak);score+=10+Math.min(streak*2,20);pop(streak>=3?"🔥":"🎉");}
else{wrong++;streak=0;if(btn)btn.classList.add("wrong");pop("💥");document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),550);}
answers.push({q:q,pick:pick,ok:ok});
$("stScore").textContent=score;$("stRight").textContent=right;$("stWrong").textContent=wrong;$("stStreak").textContent=streak;
$("combo").textContent="🔥 連對 "+streak;
const ex=$("explain");ex.innerHTML=(ok?"<b>⭕ 答對！</b> ":"<b>❌ 答錯！</b>正解是 "+["A","B","C","D"][q.a]+"："+q.o[q.a]+"<br>")+q.e;ex.classList.add("show");
$("nextBtn").textContent=idx<list.length-1?"下一題 →":"看成績單 🏁";
$("nextBtn").classList.remove("hidden");
}
$("nextBtn").onclick=()=>{if(idx<list.length-1){idx++;renderQ();}else{finish();}};
$("quitBtn").onclick=()=>finish();
function finish(){
stopTimer();$("quizPanel").classList.add("hidden");$("resultPanel").classList.remove("hidden");
const total=list.length,rate=total?Math.round(right/total*100):0;
$("rScore").textContent=score;$("rRate").textContent=rate+"%";
let g=rCompare(rate);$("rGrade").textContent=g;
$("rComment").textContent="本次："+curCat+" "+total+"題，答對"+right+"題、答錯"+wrong+"題，最高連對"+bestStreak+"。"+(rate>=70?"✅ 已達CSCS及格門檻水準，繼續保持！":"💪 未達70%門檻，去翻重點總整理PDF再回來挑戰！");
setBest(score);$("best").textContent="🏆 最佳："+best();
const rv=$("review");rv.innerHTML="";
answers.forEach((r,i)=>{const d=document.createElement("div");d.className="review-item "+(r.ok?"ok":"ng");
d.innerHTML="<b>Q"+(i+1)+" ["+r.q.c+"]</b> "+r.q.q+"<br>你的答案："+(r.pick<0?"⏱ 時間到未作答":r.q.o[r.pick])+(r.ok?" ⭕":" ❌（正解："+r.q.o[r.q.a]+"）")+"<br><span style='color:#666'>"+r.q.e+"</span>";rv.appendChild(d);});
window.scrollTo(0,0);
}
function rCompare(r){if(r>=90)return"🏆 專家";if(r>=80)return"🥇 優秀";if(r>=70)return"✅ 及格";if(r>=60)return"📖 待加強";return"🔰 新手";}
$("retryBtn").onclick=()=>{$("resultPanel").classList.add("hidden");$("setupPanel").classList.remove("hidden");window.scrollTo(0,0);};
$("homeBtn").onclick=()=>{$("resultPanel").classList.add("hidden");$("setupPanel").classList.remove("hidden");$("totalQ").textContent=QUESTIONS.length;window.scrollTo(0,0);};
})();
</script>
</body>
</html>
